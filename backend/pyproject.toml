[project]
name = "cheaptrader-backend"
version = "0.1.0"
description = "CheapTrader backend: MT5 bridge, Python indicator engine, replay, backtest, MCP."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "websockets>=13",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "kaleido>=0.2.1",
    "fastmcp>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]
# only to build CheapTrader.exe (scripts/build_exe.py)
build = ["pyinstaller>=6.10"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py311"
